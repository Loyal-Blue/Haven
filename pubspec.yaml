name: haven
description: An offline-first life planner and pixel-art town builder.
publish_to: none
version: 0.5.1+6

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  path_provider: ^2.1.5
  archive: ^4.0.9
  crypto: ^3.0.7
  image_picker: ^1.2.4
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/world/
    - assets/fonts/dmsans-OFL.txt
    - assets/fonts/fraunces-OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dmsans.ttf
    - family: Haven Serif
      fonts:
        - asset: assets/fonts/fraunces.ttf
